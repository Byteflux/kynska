name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The pinned Strudel source, sample banks, soundfonts and the Tidal grammar,
      # fetched once per Strudel pin.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: strudel-${{ hashFiles('strudel.json') }}

      - run: npm ci

      - name: Type check and tests
        run: npm run check

      - name: Build docs and reference
        run: node src/cli.ts docs build

      - name: check on every documented example
        run: npm run check:examples

      - name: check on every docs code block
        run: npm run check:docs

      - name: Onset detection
        run: node scripts/score-onsets.ts

      - name: Evals (oracle)
        run: node evals/run.ts --agent oracle

      - name: Plugin manifests
        run: |
          node -e 'for (const f of [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", ".mcp.json"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'

      # The docs built above, published to GitHub Pages from main once every check
      # has passed. The site is uploaded as an artifact, never committed.
      - name: Build the Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/build-site.ts site

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  pages:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer push waits rather than cancelling one mid-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
